<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’Italia s’è desta · Letteratura dell’Italia unita</title>
<style>
:root{--bg:#14100d;--bg2:#271b14;--paper:#f1e8d4;--paper2:#e6d9bb;--ink:#2a1f17;--soft:#6b5a49;--accent:#8c2f2a;--note:#3f6b62;--rule:rgba(42,31,23,.22);--ctl:#e9dcc0;--ctlbg:rgba(241,232,212,.08);--ctlline:rgba(241,232,212,.28);
--sb-track:#23140d;--sb-thumb:#decfa9;--sb-thumb2:#c2ae83;--sb-border:#4b2c1b;--sb-hover:#f1e8d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#110d0a;--bg2:#21170f}}
:root[data-theme="dark"]{--bg:#110d0a;--bg2:#21170f}
*,*::before,*::after{box-sizing:inherit}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  -webkit-text-size-adjust:100%;
  scrollbar-width:thin;
  scrollbar-color:var(--sb-thumb) var(--sb-track)
}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 25%,var(--bg2),var(--bg) 70%);color:var(--ctl);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;overflow-x:hidden}

/* Scrollbar laterale a tema carta e toni marroni */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{
  background:linear-gradient(180deg,#1d100a,var(--sb-track) 50%,#190e09);
  border-left:1px solid rgba(201,162,90,.2)
}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--sb-thumb),var(--sb-thumb2));
  border-radius:999px;
  border:2px solid var(--sb-track);
  box-shadow:inset 0 0 0 1px rgba(75,44,27,.45)
}
::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,var(--sb-hover),var(--sb-thumb))
}
::-webkit-scrollbar-thumb:active{
  background:linear-gradient(180deg,#e6d9bb,#b89f6e)
}
::-webkit-scrollbar-corner{background:var(--sb-track)}

.sn{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;color:rgba(233,220,192,.7)}
header b{color:var(--ctl);font-weight:600}
#where{white-space:nowrap}

.era{position:relative;height:34px;margin:6px 4px 14px;user-select:none}
.era::before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:var(--ctlline)}
.era i{position:absolute;top:16px;font:normal 10px/1 system-ui,sans-serif;color:rgba(233,220,192,.45);transform:translateX(-50%);padding-top:9px;pointer-events:none}
.era i::before{content:"";position:absolute;top:-1px;left:50%;width:1px;height:6px;background:var(--ctlline)}
.era i.egg-tick{pointer-events:auto;cursor:pointer;color:rgba(233,220,192,.55);padding-top:0;top:16px}
.era i.egg-tick::before{top:4px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--paper);border:1px solid var(--ctlline)}
.era u{position:absolute;top:13px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 4px rgba(241,232,212,.15),0 0 18px rgba(241,232,212,.5);transition:left .7s cubic-bezier(.3,.8,.2,1);pointer-events:none}
.era s{position:absolute;top:-2px;transform:translateX(-50%);font:600 13px/1 system-ui,sans-serif;text-decoration:none;color:var(--ctl);transition:left .7s cubic-bezier(.3,.8,.2,1);pointer-events:none}

.stage{perspective:2200px;position:relative;touch-action:pan-y}
.stage::before{content:"";position:absolute;inset:-13px -14px -19px;z-index:-1;border-radius:10px;background:linear-gradient(135deg,#55321f,#2b1710 55%,#41261a);box-shadow:0 34px 60px rgba(0,0,0,.7),inset 0 0 0 5px #2b1710,inset 0 0 0 6px rgba(201,162,90,.5),inset 0 2px 6px rgba(255,255,255,.12)}
.edge{position:absolute;top:5px;bottom:5px;background:repeating-linear-gradient(90deg,#e0d4b4 0 1px,#b5a680 1px 2px);transition:width .6s,left .6s,right .6s;box-shadow:inset 0 0 6px rgba(60,40,20,.5)}
.el{border-radius:3px 0 0 3px}.er{border-radius:0 3px 3px 0}
.snd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.snd button{padding:7px 12px;font-size:12px}

/* Layout normale a doppio foglio su PC / schermi grandi */
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:580px;border-radius:6px;box-shadow:0 2px 0 #e3d7b9,0 4px 0 #c9bc98,0 6px 0 #e3d7b9,0 8px 0 #bfb08a,0 0 0 1px rgba(0,0,0,.5);background:var(--paper)}
.book.dragging,.book.dragging *{user-select:none !important;cursor:grabbing !important}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:46px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(60,40,20,.22) 38%,rgba(40,25,10,.5) 50%,rgba(60,40,20,.22) 62%,transparent)}
.page{position:relative;padding:36px 38px 56px;color:var(--ink);backface-visibility:hidden}
.page.l{border-radius:6px 0 0 6px;transform-origin:100% 50%;background:linear-gradient(270deg,rgba(70,45,20,.2),transparent 14%),linear-gradient(var(--paper),var(--paper2))}
.page.r{border-radius:0 6px 6px 0;transform-origin:0 50%;background:linear-gradient(90deg,rgba(70,45,20,.2),transparent 14%),linear-gradient(var(--paper),var(--paper2))}
.page.r::before{content:"";position:absolute;top:-8px;right:46px;width:17px;height:78px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.sig{position:absolute;bottom:18px;font:italic 13.5px/1 Georgia,serif;color:var(--soft)}
.l .sig{left:38px}.r .sig{right:38px}
.fol{position:absolute;top:15px;font:500 11.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.05em;color:var(--soft)}
.l .fol{left:38px}.r .fol{right:100px}
.kick{font:600 12.5px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--accent);margin:12px 0 6px;letter-spacing:.03em}
h2{font-weight:400;margin:0 0 14px;line-height:1.08;letter-spacing:-.01em;font-size:clamp(30px,3.8vw,45px)}
.lead{font-size:18.5px;line-height:1.62;margin:0 0 16px}
.lead::first-letter{float:left;font-size:3.4em;line-height:.82;padding:4px 8px 0 0;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px;padding:0;list-style:none}
.chips li{font:500 12.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;padding:7px 12px;border:1px solid var(--rule);border-radius:99px;transition:background .2s,color .2s}
.chips li:hover{background:var(--ink);color:var(--paper)}
.key{margin:0 0 16px;padding:11px 15px 12px;background:rgba(140,47,42,.07);border:1px dashed rgba(140,47,42,.45);transform:rotate(-.8deg);transition:transform .3s}
.key:hover{transform:rotate(0)}
.key b{display:block;font:600 12.5px/1.3 system-ui,sans-serif;color:var(--accent);margin-bottom:3px}
.key span{font-size:15.5px;line-height:1.48;font-style:italic}
.verse{margin:8px 0 0;padding:7px 0 7px 18px;border-left:2px solid var(--accent);font-style:italic;font-size:20.5px;line-height:1.7;transition:padding-left .25s,background .25s}
.verse:hover{padding-left:26px;background:linear-gradient(90deg,rgba(140,47,42,.08),transparent)}
.verse .ln{display:block}
.verse cite{display:block;margin-top:6px;font:500 12.5px/1.3 system-ui,sans-serif;font-style:normal;color:var(--soft)}
.tl{list-style:none;margin:6px 0 0;padding:0 0 0 18px;border-left:1.5px solid var(--accent)}
.tl li{position:relative;margin:0 0 12px;font-size:16px;line-height:1.48;transition:transform .25s}
.tl li:hover{transform:translateX(5px)}
.tl li::before{content:"";position:absolute;left:-24px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.tl b{display:block;font:600 12.5px/1.4 system-ui,sans-serif;color:var(--accent)}
.vs{display:grid;gap:12px;margin-top:6px}
.vs>div,.cd,.note{padding:12px 15px;border-left:3px solid var(--note);background:rgba(63,107,98,.09);border-radius:0 4px 4px 0;transition:transform .25s,box-shadow .25s}
.vs>div:last-of-type{border-left-color:var(--accent);background:rgba(140,47,42,.07)}
.vs>div:hover,.cd:hover,.note:hover{transform:translateX(5px);box-shadow:0 6px 16px rgba(42,31,23,.16)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.cd:hover{transform:translateY(-3px)}
h3{margin:0 0 4px;font:600 13.5px/1.3 system-ui,sans-serif;color:var(--note);letter-spacing:.02em}
.vs>div:last-of-type h3{color:var(--accent)}
p{margin:0}.vs p,.cd p,.note p{font-size:15.5px;line-height:1.52}
.big{font-size:clamp(46px,6.2vw,66px);line-height:1;color:var(--accent);margin:6px 0 4px}
.cap{font-size:16px;line-height:1.52;margin-bottom:14px}
.note{margin-top:12px}
.sep{margin:16px 0 14px;padding-top:14px;border-top:1px dashed var(--rule)}
.sec-h{margin:0 0 10px;font:700 12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}

.egg-body{font-size:18px;line-height:1.68;white-space:pre-wrap;margin:8px 0 16px;color:var(--ink)}
.egg-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.egg-nav button{color:var(--ink);background:rgba(42,31,23,.08);border-color:var(--rule)}
.egg-nav button:hover:not(:disabled){background:rgba(42,31,23,.16)}

.page.airy .lead{font-size:20px;line-height:1.68;margin-bottom:20px}
.page.airy .key span{font-size:17px;line-height:1.52}
.page.airy .verse{font-size:22px;line-height:1.75}
.page.airy .vs p,.page.airy .cd p,.page.airy .note p{font-size:16.8px;line-height:1.58}
.page.airy .tl li{font-size:17.2px;line-height:1.54;margin-bottom:14px}
.page.airy .cap{font-size:17.5px;line-height:1.58}

.ink{opacity:0;animation:ink .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*85ms + 160ms)}
@keyframes ink{from{opacity:0;filter:blur(5px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:none}}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:20px}
button{font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ctl);background:var(--ctlbg);border:1px solid var(--ctlline);border-radius:99px;padding:11px 18px;cursor:pointer;transition:background .2s,transform .2s;-webkit-tap-highlight-color:transparent}
button:hover:not(:disabled){background:rgba(241,232,212,.18)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--ctl);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px}
.pills button{padding:7px 11px;font-size:12px;border-top:3px solid var(--c)}
.pills button[aria-current="true"]{background:var(--paper);color:var(--ink)}
.hint{text-align:center;font:12px/1.4 system-ui,sans-serif;color:rgba(233,220,192,.5);margin-top:12px}

/* Solo su telefono: pagina singola unificata e controlli touch */
@media (max-width:760px){
  .wrap{padding:12px 14px 24px}
  header{font-size:11.5px;gap:8px}
  .era{margin:6px 6px 12px}
  .stage::before{inset:-6px -6px -9px;border-radius:9px;box-shadow:0 18px 34px rgba(0,0,0,.72),inset 0 0 0 3px #2b1710,inset 0 0 0 4px rgba(201,162,90,.48)}
  .edge,.book::after{display:none}
  .book{display:block;min-height:0;box-shadow:0 2px 0 #e3d7b9,0 4px 0 #c9bc98,0 0 0 1px rgba(0,0,0,.5)}
  .page.m-single{
    border-radius:6px;transform-origin:50% 0;
    padding:34px 20px 44px;
    background:linear-gradient(var(--paper),var(--paper2))
  }
  .page.m-single::before{
    content:"";position:absolute;top:-7px;right:20px;width:15px;height:62px;
    background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.38))
  }
  .page.m-single .fol{top:13px;left:20px;right:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page.m-single .sig{bottom:14px;right:20px;left:auto}
  .cg{grid-template-columns:1fr}
  h2{font-size:clamp(26px,7.2vw,34px)}
  .lead,.page.airy .lead{font-size:17px;line-height:1.58;margin-bottom:14px}
  .key{transform:none;border-radius:4px}
  .key span,.page.airy .key span{font-size:15px;line-height:1.46}
  .verse,.page.airy .verse{font-size:18px;line-height:1.58;padding-left:14px;margin-bottom:14px}
  .verse:hover{padding-left:14px}
  .vs p,.cd p,.note p,.page.airy .vs p,.page.airy .cd p,.page.airy .note p{font-size:15px;line-height:1.48}
  .tl li,.page.airy .tl li{font-size:15.2px;line-height:1.46;margin-bottom:10px}

  nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  #prev{grid-column:1;grid-row:1;width:100%}
  #next{grid-column:2;grid-row:1;width:100%}
  .pills{
    grid-column:1 / -1;grid-row:2;display:flex;flex-wrap:nowrap;justify-content:flex-start;
    overflow-x:auto;max-width:100%;padding:4px 2px 8px;gap:6px;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;
    scrollbar-color:var(--sb-thumb) var(--sb-track);scroll-behavior:smooth
  }
  .pills::-webkit-scrollbar{height:6px}
  .pills::-webkit-scrollbar-track{background:var(--sb-track);border-radius:999px}
  .pills::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:999px}
  .pills button{flex:0 0 auto;padding:8px 12px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.ink{animation:none;opacity:1}.era u,.era s{transition:none}}
</style>
</head>

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function eggControlsHtml(pIdx){
  const canPrev=pIdx>0;
  const canNext=pIdx<EGG_PAGES.length-1;
  return `<div class="egg-nav ink" style="--i:4">
    <button type="button" id="eggPrev" ${canPrev?"":"disabled"}>← Pagina segreta prec.</button>
    <button type="button" id="eggNext" ${canNext?"":"disabled"}>Pagina segreta succ. →</button>
    <button type="button" id="eggBack">Torna alle carte</button>
  </div>`;
}

function renderEggSingle(pIdx){
  const pg=EGG_PAGES[pIdx];
  return `<span class="fol">2026 · segreta ${pIdx+1}/${EGG_PAGES.length}</span>
  <div class="kick ink" style="--i:0">${esc(pg.kick)}</div>
  <h2 class="ink" style="--i:1">${esc(pg.title)}</h2>

function bindEggControls(){
  const bBack=$("eggBack");
  const bPrev=$("eggPrev");
  const bNext=$("eggNext");
  if(bBack)bBack.addEventListener("click",()=>{eggOpen=false;paint(cur)});
  if(bPrev)bPrev.addEventListener("click",()=>{if(eggUnlocked&&eggOpen)goEgg(eggPage-1)});
  if(bNext)bNext.addEventListener("click",()=>{if(eggUnlocked&&eggOpen)goEgg(eggPage+1)});
}

function rightBody(r,d){
  if(r.t==="tl")return `<ol class="tl">${r.i.map(x=>`<li class="ink" ${d()}><b>${x[0]}</b>${x[1]}</li>`).join("")}</ol>`;
  if(r.t==="vs")return `<div class="vs">${[r.a,r.b].map(x=>`<div class="ink" ${d()}><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div><div class="note ink" ${d()}><p>${r.n}</p></div>`;
  if(r.t==="cards")return `<div class="cg">${r.i.map(x=>`<div class="cd ink" ${d()}><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div>`;
  const n=r.i.map(x=>`<div class="note ink" ${d()}><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("");
  return r.t==="stat"?`<div class="big ink" ${d()}>${r.b}</div><p class="cap ink" ${d()}>${r.d}</p>${n}`:n;
}

function right(c,d){
  const r=c.r;
  return `<span class="fol">${r.h}</span><div class="kick ink" ${d()}>${r.h}</div>${rightBody(r,d)}`;
}

  <span class="sig">c. ${i+1}r</span>`;

    $("hint").textContent="Frecce ← → o swipe (senza testo selezionato) per sfogliare · la lanterna scorre lungo la linea del tempo";
  }else{
    pl.className="page l";
    pr.className="page r";
    pr.style.display="";
    $("hint").textContent="Frecce ← → o trascina le pagine (senza testo selezionato) per sfogliare · la lanterna scorre lungo la linea del tempo";
  }
}

function setAiry(i){
  const c=C[i];
  const leftLen=c.l.length+c.key[1].length+(c.v?c.v.join(" ").length:0);
  const rightLen=c.r.t==="tl"?c.r.i.reduce((s,x)=>s+x[1].length,0):
   c.r.t==="vs"?c.r.a[1].length+c.r.b[1].length+(c.r.n?c.r.n.length:0):
   c.r.i.reduce((s,x)=>s+x[1].length,0);
  pl.classList.toggle("airy",leftLen<310);
  pr.classList.toggle("airy",rightLen<320);
}

function centerPill(i){
  if(!isPhone())return;
  const pills=$("pills"),btn=pills.querySelectorAll("button")[i];
  if(!btn||pills.scrollWidth<=pills.clientWidth)return;
  const left=btn.offsetLeft-(pills.clientWidth-btn.offsetWidth)/2;
  pills.scrollTo({left:Math.max(0,left),behavior:reduce?"auto":"smooth"});
}

function paint(i){
  syncSlots();
  if(eggOpen&&eggUnlocked){
    eggPage=clamp(eggPage,0,EGG_PAGES.length-1);
    if(isPhone()){
      pl.innerHTML=renderEggSingle(eggPage);
    }else{
      const [a,b]=renderEggDesktop(eggPage);
      pl.innerHTML=a;
      pr.innerHTML=b;
    }
    pl.classList.remove("airy");
    pr.classList.remove("airy");
    bindEggControls();
    $("where").textContent=`2026 · Segreta ${eggPage+1} di ${EGG_PAGES.length}`;
    $("lan").style.left=$("lab").style.left="99.5%";
    $("lab").textContent="2026";
    edges(C.length-1);
    $("prev").disabled=eggPage===0;
    $("next").disabled=eggPage===EGG_PAGES.length-1;
    document.querySelectorAll(".pills button").forEach(el=>el.setAttribute("aria-current","false"));
    return;
  }

  eggOpen=false;
  if(isPhone()){
    pl.innerHTML=htmlSingle(i);
  }else{
    const [a,b]=html(i);
    pl.innerHTML=a;
    pr.innerHTML=b;
  }
  setAiry(i);
  cur=i;
  $("where").textContent=`Carta ${i+1} di ${C.length}`;
  $("lan").style.left=$("lab").style.left=pos(C[i].y);
  $("lab").textContent=C[i].y;
  edges(i);
  $("prev").disabled=i===0;
  $("next").disabled=i===C.length-1;
  document.querySelectorAll(".pills button").forEach((el,j)=>el.setAttribute("aria-current",j===i));
  centerPill(i);
}

async function animateTurn(dir,renderFn){
  const f=dir==="next";
  if(reduce||!pl.animate){
    sfx(dir);
    renderFn();
    return;
  }
  busy=true;
  sfx(dir);
  if(isPhone()){
    await book.animate([
      {transform:"translateX(0)",opacity:1},
      {transform:`translateX(${f?-22:22}px)`,opacity:.15}
    ],{duration:210,easing:"ease-in",fill:"forwards"}).finished;
    renderFn();
    if(window.scrollY>book.offsetTop){
      window.scrollTo({top:Math.max(0,book.offsetTop-12),behavior:"smooth"});
    }
    await book.animate([
      {transform:`translateX(${f?22:-22}px)`,opacity:.15},
      {transform:"translateX(0)",opacity:1}
    ],{duration:240,easing:"ease-out"}).finished;
    book.getAnimations().forEach(a=>a.cancel());
  }else{
    const out=f?pr:pl;
    await out.animate([
      {transform:"rotateY(0)",opacity:1,filter:"brightness(1)"},
      {transform:`rotateY(${f?-78:78}deg)`,opacity:.15,filter:"brightness(.7)"}
    ],{duration:340,easing:"ease-in",fill:"forwards"}).finished;
    renderFn();
    (f?pl:pr).animate([
      {transform:`rotateY(${f?72:-72}deg)`,opacity:.2},
      {transform:"rotateY(0)",opacity:1}
    ],{duration:360,easing:"ease-out"});
    out.getAnimations().forEach(a=>a.cancel());
  }
  busy=false;
}

async function openEgg2026(pageIdx=0){
  if(busy)return;
  eggUnlocked=true;
  eggOpen=true;
  eggPage=clamp(pageIdx,0,EGG_PAGES.length-1);
  await animateTurn("next",()=>paint(cur));
}

async function goEgg(targetPage){
  if(busy||!eggUnlocked||!eggOpen)return;
  const nextIdx=clamp(targetPage,0,EGG_PAGES.length-1);
  if(nextIdx===eggPage)return;
  const dir=nextIdx>eggPage?"next":"prev";
  await animateTurn(dir,()=>{
    eggPage=nextIdx;
    paint(cur);
  });
}

async function go(i){
  if(busy)return;
  if(eggOpen){
    if(!eggUnlocked)return;
    const delta=i>cur?1:-1;
    const nextEgg=eggPage+delta;
    if(nextEgg>=0&&nextEgg<EGG_PAGES.length){
      await goEgg(nextEgg);
      return;
    }
    if(delta<0){
      eggOpen=false;
      await animateTurn("prev",()=>paint(cur));
    }
    return;
  }
  if(i<0||i>=C.length||i===cur)return;
  const dir=i>cur?"next":"prev";
  await animateTurn(dir,()=>paint(i));
}

/* Suoni: avanti = browse.ogg, indietro = browse2.ogg */
const SOUNDS={next:"browse.ogg",prev:"browse2.ogg"};
let AC,muted=false,clips={
 next:SOUNDS.next?new Audio(SOUNDS.next):null,
 prev:SOUNDS.prev?new Audio(SOUNDS.prev):null
};
function edges(i){const n=C.length-1,l=2+9*i/n,r=2+9*(n-i)/n;
 $("el").style.width=l+"px";$("el").style.left=-l+"px";$("er").style.width=r+"px";$("er").style.right=-r+"px"}
function sfx(dir="next"){if(muted)return;
 const base=clips[dir]||clips.next;
 if(base){const a=base.cloneNode();a.playbackRate=.94+Math.random()*.12;a.play().catch(()=>{});return}
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,n=AC.sampleRate*.45|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let k=0;k<n;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/n,2.2)*(.6+.4*Math.sin(k/180));
 const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type="bandpass";f.Q.value=.8;f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(4200,t+.35);
 const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.42);
 s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
 const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(110,t+.3);o.frequency.exponentialRampToValueAtTime(55,t+.45);
 og.gain.setValueAtTime(.0001,t+.3);og.gain.exponentialRampToValueAtTime(.25,t+.32);og.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(og);og.connect(AC.destination);o.start(t+.3);o.stop(t+.52)}catch(e){}}

$("mute").onclick=e=>{muted=!muted;e.target.textContent=muted?"Suono: spento":"Suono: attivo";e.target.setAttribute("aria-pressed",muted)};
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);
$("pills").innerHTML=C.map((c,i)=>`<button data-i="${i}" style="--c:${COL[c.g]}" title="${c.t}">${i+1}. ${c.p}</button>`).join("");
$("pills").onclick=e=>{const b=e.target.closest("button");if(b){eggOpen=false;go(+b.dataset.i)}};
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);else if(e.key==="ArrowLeft")go(cur-1)});

/* Gesture swipe/drag orizzontale solo quando non c'è testo selezionato */
let tx=0,ty=0,dragging=false;
const hasTextSelection=()=>{
  if(!window.getSelection)return false;
  const s=window.getSelection();
  return !!(s&&!s.isCollapsed&&String(s).trim().length>0);
};
const resetDrag=()=>{
  tx=0;ty=0;dragging=false;
  book.classList.remove("dragging");
};
const dragStart=(x,y,target)=>{
  if(busy||target.closest("button,a,textarea,input"))return;
  if(hasTextSelection())return;
  tx=x;ty=y;dragging=true;
};
const dragMove=(x,y)=>{
  if(!dragging)return;
  if(hasTextSelection()){resetDrag();return}
  const dx=x-tx,dy=y-ty;
  if(Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*1.3){
    book.classList.add("dragging");
  }
};
const dragEnd=(x,y)=>{
  if(!dragging)return;
  if(hasTextSelection()){resetDrag();return}
  const dx=x-tx,dy=y-ty;
  resetDrag();
  const minDist=isPhone()?52:70;
  if(Math.abs(dx)>minDist&&Math.abs(dx)>Math.abs(dy)*1.4){
    go(dx<0?cur+1:cur-1);
  }
};

$("stage").addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  dragStart(e.touches[0].clientX,e.touches[0].clientY,e.target);
},{passive:true});
$("stage").addEventListener("touchmove",e=>{
  if(e.touches.length!==1)return;
  dragMove(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
$("stage").addEventListener("touchend",e=>{
  if(e.changedTouches.length!==1)return;
  dragEnd(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
},{passive:true});

$("stage").addEventListener("mousedown",e=>{
  if(e.button!==0)return;
  dragStart(e.clientX,e.clientY,e.target);
});
addEventListener("mousemove",e=>dragMove(e.clientX,e.clientY));
addEventListener("mouseup",e=>dragEnd(e.clientX,e.clientY));

mobileMq.addEventListener("change",()=>paint(cur));

/* Ogni refresh riparte sempre da zero senza leggere hash o storage */
if(location.hash){
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
}
paint(0);
</script>
